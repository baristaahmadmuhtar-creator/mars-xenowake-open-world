<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barista Merantau V2</title><style>html,body{margin:0;height:100%;background:#101315;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}#s{padding:24px;text-align:center;opacity:.8}</style></head><body><div id="s">Loading Barista Merantau V2…</div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(i=>fetch(`chunk${i}.txt`).then(r=>{if(!r.ok)throw new Error(`chunk ${i}`);return r.text()})));const b=Uint8Array.from(atob(parts.join('').trim()),c=>c.charCodeAt(0));const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='Gagal memuat build V2: '+e.message}})();</script></body></html>
